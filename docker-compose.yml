volumes:
  certs:
    driver: local
  esdata01:
    driver: local
  esdata02:
    driver: local
  esdata03:
    driver: local
  kibanadata:
    driver: local
  apmdata:
    driver: local
networks:
  elastic:
    driver: bridge

services:
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    volumes:
      - /home/anson/es-apm-stack/heydevops.com:/usr/share/elasticsearch/config/certs
    user: "0"
    command: >
      bash -c '
        if [ x${ELASTIC_PASSWORD} == x ]; then
          echo "Set the ELASTIC_PASSWORD environment variable in the .env file";
          exit 1;
        elif [ x${KIBANA_PASSWORD} == x ]; then
          echo "Set the KIBANA_PASSWORD environment variable in the .env file";
          exit 1;
        fi;
        echo "Waiting for Elasticsearch availability";
        until curl --cacert config/certs/fullchain1.pem https://es01.heydevops.com:9200 | grep -q "missing authentication credentials"; do sleep 30; done;
        echo "Setting kibana_system password";
        until curl -X POST --cacert config/certs/fullchain1.pem -u "elastic:${ELASTIC_PASSWORD}" -H "Content-Type: application/json" https://es01.heydevops.com:9200/_security/user/kibana_system/_password -d "{\"password\":\"${KIBANA_PASSWORD}\"}" | grep -q "^{}"; do sleep 10; done;
        echo "All done!";
      '
    networks:
      elastic:

    healthcheck:
      test: ["CMD-SHELL", "[ -f config/certs/privkey1.pem ]"]
      interval: 1s
      timeout: 5s
      retries: 120
  es01:
    depends_on:
      setup:
        condition: service_healthy
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    labels:
      co.elastic.logs/module: elasticsearch
    volumes:
      - /home/anson/es-apm-stack/heydevops.com:/usr/share/elasticsearch/config/certs
      - esdata01:/usr/share/elasticsearch/data
    ports:
      - ${ES_PORT}:9200
    environment:
      - node.name=es01
      - cluster.name=${CLUSTER_NAME}
      - discovery.seed_hosts=es02
      - cluster.initial_master_nodes=es01,es02
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      # Enable encryption for HTTP API client connections, such as Kibana, Logstash, and Agents
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=/usr/share/elasticsearch/config/certs/privkey1.pem
      - xpack.security.http.ssl.certificate=/usr/share/elasticsearch/config/certs/cert1.pem
      - xpack.security.http.ssl.certificate_authorities=/usr/share/elasticsearch/config/certs/fullchain1.pem
      # Enable encryption and mutual authentication between cluster nodes
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=/usr/share/elasticsearch/config/certs/privkey1.pem
      - xpack.security.transport.ssl.certificate=/usr/share/elasticsearch/config/certs/cert1.pem
      - xpack.security.transport.ssl.certificate_authorities=/usr/share/elasticsearch/config/certs/fullchain1.pem
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${LICENSE}
    mem_limit: ${ES_MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      elastic:
        aliases:
          - es01.heydevops.com
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/fullchain1.pem https://es01.heydevops.com:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  es02:
    depends_on:
      setup:
        condition: service_healthy
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    labels:
      co.elastic.logs/module: elasticsearch
    volumes:
      - /home/anson/es-apm-stack/heydevops.com:/usr/share/elasticsearch/config/certs
      - esdata02:/usr/share/elasticsearch/data
    environment:
      - node.name=es02
      - cluster.name=${CLUSTER_NAME}
      - discovery.seed_hosts=es01,es03
      - cluster.initial_master_nodes=es01,es02
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=/usr/share/elasticsearch/config/certs/privkey1.pem
      - xpack.security.http.ssl.certificate=/usr/share/elasticsearch/config/certs/cert1.pem
      - xpack.security.http.ssl.certificate_authorities=/usr/share/elasticsearch/config/certs/fullchain1.pem
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=/usr/share/elasticsearch/config/certs/privkey1.pem
      - xpack.security.transport.ssl.certificate=/usr/share/elasticsearch/config/certs/cert1.pem
      - xpack.security.transport.ssl.certificate_authorities=/usr/share/elasticsearch/config/certs/fullchain1.pem
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${LICENSE}
    mem_limit: ${ES_MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      elastic:
        aliases:
          - es02.heydevops.com
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/fullchain1.pem https://es02.heydevops.com:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  es03:
    depends_on:
      setup:
        condition: service_healthy
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    labels:
      co.elastic.logs/module: elasticsearch
    volumes:
      - /home/anson/es-apm-stack/heydevops.com:/usr/share/elasticsearch/config/certs
      - esdata03:/usr/share/elasticsearch/data
    environment:
      - node.name=es03
      - cluster.name=${CLUSTER_NAME}
      - discovery.seed_hosts=es01,es02
      - cluster.initial_master_nodes=es01,es02,es03
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=/usr/share/elasticsearch/config/certs/privkey1.pem
      - xpack.security.http.ssl.certificate=/usr/share/elasticsearch/config/certs/cert1.pem
      - xpack.security.http.ssl.certificate_authorities=/usr/share/elasticsearch/config/certs/fullchain1.pem
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=/usr/share/elasticsearch/config/certs/privkey1.pem
      - xpack.security.transport.ssl.certificate=/usr/share/elasticsearch/config/certs/cert1.pem
      - xpack.security.transport.ssl.certificate_authorities=/usr/share/elasticsearch/config/certs/fullchain1.pem
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${LICENSE}
    mem_limit: ${ES_MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      elastic:
        aliases:
          - es03.heydevops.com
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/fullchain1.pem https://es03.heydevops.com:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  kibana:
    depends_on:
      es01:
        condition: service_healthy
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    labels:
      co.elastic.logs/module: kibana
    volumes:
      - /home/anson/es-apm-stack/heydevops.com:/usr/share/kibana/config/certs
      - kibanadata:/usr/share/kibana/data
    ports:
      - ${KIBANA_PORT}:5601
    environment:
      SERVER_NAME: kibana.heydevops.com
      SERVER_PUBLICBASEURL: https://kibana.heydevops.com:5601
      ELASTICSEARCH_HOSTS: '["https://es01.heydevops.com:9200"]'
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD}
      ELASTICSEARCH_SSL_VERIFICATIONMODE: none
      ELASTICSEARCH_SSL_CERTIFICATE: /usr/share/kibana/config/certs/cert1.pem
      ELASTICSEARCH_SSL_KEY: /usr/share/kibana/config/certs/privkey1.pem
      ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES: /usr/share/kibana/config/certs/fullchain1.pem
      XPACK_SECURITY_ENCRYPTIONKEY: ${ENCRYPTION_KEY}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${ENCRYPTION_KEY}
      XPACK_REPORTING_ENCRYPTIONKEY: ${ENCRYPTION_KEY}
      SERVER_SSL_ENABLED: true
      SERVER_SSL_KEY: /usr/share/kibana/config/certs/privkey1.pem
      SERVER_SSL_CERTIFICATE: /usr/share/kibana/config/certs/cert1.pem
    mem_limit: ${KB_MEM_LIMIT}
    networks:
      elastic:
        aliases:
          - kibana.heydevops.com
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -I --cacert config/certs/fullchain1.pem  https://kibana.heydevops.com:5601 | grep -q 'HTTP/1.1 302 Found'",
        ]
      interval: 10s
      timeout: 10s
      retries: 12

  apm:
    image: docker.elastic.co/apm/apm-server:${STACK_VERSION}
    depends_on:
      es01:
        condition: service_healthy
      kibana:
        condition: service_healthy
    cap_add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
    cap_drop: ["ALL"]
    ports:
    - ${APM_PORT}:8200
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - apmdata:/usr/share/apm/data
    command: >
       apm-server -e
         -E apm-server.rum.enabled=true
         -E apm-server.kibana.protocol="https"
         -E setup.kibana.host="kibana.heydevops.com:5601"
         -E apm-server.auth.api_key.enabled=true
         -E apm-server.auth.anonymous.enabled=true
         -E apm-server.auth.anonymous.allow_agent=[go,otlp]
         -E setup.template.settings.index.number_of_replicas=0
         -E apm-server.kibana.enabled=true
         -E apm-server.kibana.host="kibana.heydevops.com:5601"
         -E apm-server.kibana.ssl.enabled=true
         -E apm-server.kibana.username=elastic
         -E apm-server.kibana.password=${KIBANA_PASSWORD}
         -E apm-server.kibana.ssl.certificate_authorities=/usr/share/elasticsearch/config/certs/fullchain1.pem
         -E apm-server.kibana.ssl.certificate=/usr/share/elasticsearch/config/certs/cert1.pem
         -E apm-server.kibana.ssl.key=/usr/share/elasticsearch/config/certs/privkey1.pem
         -E output.elasticsearch.hosts=["https://es01.heydevops.com:9200"]
         -E output.elasticsearch.username=elastic
         -E output.elasticsearch.password=${ELASTIC_PASSWORD}
         -E output.elasticsearch.ssl.enabled=true
         -E output.elasticsearch.ssl.certificate_authorities=/usr/share/elasticsearch/config/certs/fullchain1.pem
         -E output.elasticsearch.ssl.certificate=/usr/share/elasticsearch/config/certs/cert1.pem
         -E output.elasticsearch.ssl.key=/usr/share/elasticsearch/config/certs/privkey1.pem
    networks:
      elastic:
        aliases:
          - apm.heydevops.com
    healthcheck:
      interval: 10s
      retries: 12
      test: curl --cacert config/certs/ca/ca.crt --write-out 'HTTP %{http_code}' --fail --silent --output /dev/null http://apm.heydevops.com:8200/